<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="得利蔦屋">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23000' width='192' height='192'/><text x='5' y='185' font-size='155' font-family='serif' fill='white' text-anchor='start'>蔦</text><text x='188' y='44' font-size='40' font-family='sans-serif' font-weight='700' fill='white' text-anchor='end'>DM</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23000' width='180' height='180' rx='40'/><text x='5' y='174' font-size='145' font-family='serif' fill='white' text-anchor='start'>蔦</text><text x='176' y='42' font-size='38' font-family='sans-serif' font-weight='700' fill='white' text-anchor='end'>DM</text></svg>">
    <title>得利蔦屋-管理系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-tokens.css">
    <style>
        /* Override design-tokens primary back to ivory for the carousel */
        :root {
            --primary:        #FFFFF0;
            --on-primary:     #2C1F0E;
            --primary-dim:    rgba(44,31,14,0.07);
            --primary-border: rgba(44,31,14,0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000;
            color: var(--on-bg);
            display: flex;
            flex-direction: row;
            height: 100%;
            overflow: hidden;
        }

        /* ── 430px app column ── */
        #appColumn {
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: var(--bg, #F8F7F2);
        }

        /* ── Module sections (show/hide switching) ── */
        .module-section {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        .module-section.active { display: flex; }

        /* ── View carousel (peek pattern) ── */
        .view-viewport {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .view-track {
            display: flex;
            height: 100%;
            transition: transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .view-section {
            flex: 0 0 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--bg, #F8F7F2);
        }

        /* ── Month view ── */
        #viewMonth { background: #000; }

        .month-content { padding: 0 12px calc(20px); }

        .cal-month-big {
            padding: 20px 4px 16px;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .cal-month-name {
            font-size: 48px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -2px;
            line-height: 1;
        }
        .cal-year-small {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.5px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .cal-hdr {
            text-align: center;
            font-size: 10px; font-weight: 700;
            color: rgba(255,255,255,0.3);
            padding: 4px 0 10px;
            letter-spacing: 0.5px;
        }
        .cal-day {
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 14px; font-weight: 500;
            color: #fff;
            transition: background 0.12s;
            position: relative;
        }
        .cal-day:hover { background: rgba(255,255,255,0.08); }
        .cal-day.empty { cursor: default; pointer-events: none; }
        .cal-day.other-month { color: rgba(255,255,255,0.18); }
        .cal-day.today {
            background: var(--primary);
            color: var(--on-primary);
            font-weight: 700;
        }
        .cal-day.selected:not(.today) {
            background: rgba(44,31,14,0.08);
            color: #fff;
            font-weight: 700;
        }
        .cal-day.today.selected {
            background: var(--primary);
            color: var(--on-primary);
        }
        .cal-day .day-num { font-size: 14px; }

        /* ── Month nav ── */
        .cal-month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 12px;
        }
        .cal-month-nav button {
            width: 36px; height: 36px;
            border: none; background: rgba(255,255,255,0.08);
            border-radius: 50%; cursor: pointer;
            color: rgba(255,255,255,0.6);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.12s;
        }
        .cal-month-nav button:hover { background: rgba(255,255,255,0.16); }
        .cal-month-nav button svg { width: 14px; height: 14px; }
        .cal-today-btn {
            font-size: 11px; font-weight: 700;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.5px;
            cursor: pointer;
            padding: 4px 10px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: none;
            transition: all 0.12s;
        }
        .cal-today-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

        /* ── Week view ── */
        #viewWeek {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--primary);
        }

        .week-nav-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            background: linear-gradient(rgba(44, 31, 14, 0.02), rgba(44, 31, 14, 0.02)), var(--primary);
            color: rgba(44, 31, 14, 0.45);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            user-select: none;
            position: relative;
            z-index: 10;
            transition: background-color 0.2s, color 0.2s;
            flex-shrink: 0;
        }
        .week-nav-bar.top-bar {
            height: calc(40px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            border-bottom: 1px solid var(--primary-border);
        }
        .week-nav-bar.bottom-bar {
            height: 40px;
            border-top: 1px solid var(--primary-border);
        }
        .week-nav-bar:hover {
            background: linear-gradient(rgba(44, 31, 14, 0.06), rgba(44, 31, 14, 0.06)), var(--primary);
            color: var(--on-primary);
        }
        .week-nav-bar:active {
            background: linear-gradient(rgba(44, 31, 14, 0.1), rgba(44, 31, 14, 0.1)), var(--primary);
        }
        .week-nav-bar svg { transition: transform 0.2s; }
        .week-nav-bar:hover svg { transform: scale(1.15); }

        .week-strips {
            flex: 1;
            display: flex;
            flex-direction: column;
            transition: transform 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            overflow: hidden;
        }

        .day-strip {
            flex: 1;
            display: flex;
            border-bottom: 1px solid var(--primary-border);
            cursor: pointer;
            transition: background 0.12s;
            min-height: 0;
        }
        .day-strip:hover { background: var(--primary-dim); }
        .day-strip.today { background: rgba(44,31,14,0.1); }

        .strip-month {
            width: 20px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .strip-month-label {
            font-size: 8px; font-weight: 700;
            color: rgba(44,31,14,0.38);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .strip-date {
            width: 68px; flex-shrink: 0;
            display: flex; flex-direction: column;
            justify-content: center;
            padding: 0 12px 0 6px;
        }
        .strip-weekday {
            font-size: 9px; font-weight: 700;
            color: rgba(44,31,14,0.48);
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }
        .strip-num {
            font-size: 34px; font-weight: 800;
            color: var(--on-primary);
            line-height: 1;
            letter-spacing: -1.5px;
        }
        .strip-today-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--on-primary);
            margin-top: 3px;
        }

        .strip-body {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 8px 12px 8px 0;
            position: relative;
            min-width: 0;
        }
        .strip-empty {
            font-size: 12px; color: rgba(44,31,14,0.3);
            font-style: italic;
        }
        .strip-weather {
            flex-shrink: 0;
            display: flex; align-items: center; gap: 3px;
            font-size: 11px; font-weight: 600;
            color: rgba(44,31,14,0.48);
            padding-right: 12px;
            align-self: flex-start;
            padding-top: 10px;
        }

        /* ── Day modal (bottom sheet, origin-aware fold) ── */
        .day-modal-backdrop {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.35);
            z-index: 10;
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .day-modal-backdrop.open { opacity: 1; pointer-events: auto; }
        .day-modal {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            top: 100%;
            background: #18877a;
            z-index: 11;
            border-radius: 16px 16px 0 0;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .day-strip.strip-active {
            opacity: 0.4;
            pointer-events: none;
        }
        .day-modal-strip-header {
            flex-shrink: 0;
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            position: relative;
        }
        .day-modal-strip-header .strip-body {
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 10px 48px 10px 0;
        }
        .day-modal-label {
            font-size: 18px; font-weight: 800;
            color: #fff; line-height: 1;
            letter-spacing: -0.5px;
        }
        .day-modal-date-sub {
            font-size: 10px; font-weight: 600;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .day-modal-close {
            position: absolute; top: 50%; right: 12px;
            transform: translateY(-50%);
            width: 28px; height: 28px;
            border: none; background: rgba(255,255,255,0.15);
            border-radius: 50%;
            color: rgba(255,255,255,0.8); font-size: 12px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .day-modal-scroll {
            flex: 1; overflow-y: auto;
            padding: 20px 20px 32px;
        }
        .day-empty {
            text-align: center; padding: 28px 0;
            font-size: 13px; color: rgba(255,255,255,0.4);
            font-style: italic;
        }

        /* ── Settings overlay ── */
        .overlay-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 500;
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .overlay-backdrop.open { opacity: 1; pointer-events: auto; }

        .settings-panel {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: min(300px, 85vw);
            background: var(--surface, #fff);
            z-index: 501;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex; flex-direction: column;
            padding-top: max(0px, env(safe-area-inset-top));
        }
        .settings-panel.open { transform: translateX(0); }

        .settings-header {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--outline, #e5e7eb);
        }
        .settings-header-title {
            font-size: 16px; font-weight: 700;
            font-family: 'Noto Serif TC', serif;
        }
        .settings-close {
            width: 28px; height: 28px;
            border: none; background: none;
            cursor: pointer;
            font-size: 18px; color: var(--on-surface-var, #64748b);
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .settings-close:hover { background: var(--bg, #F8F7F2); }

        .settings-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

        .settings-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid var(--outline, #e5e7eb);
            font-size: 13px;
        }
        .settings-row:last-child { border-bottom: none; }
        .settings-label { color: var(--on-surface-var, #64748b); }
        .settings-val { font-weight: 600; font-size: 12px; text-align: right; max-width: 55%; word-break: break-all; }
        .settings-section-title {
            font-size: 10px; font-weight: 700;
            color: var(--on-surface-var, #64748b);
            letter-spacing: 0.8px; text-transform: uppercase;
            padding: 16px 0 6px;
        }
        .settings-logout-btn {
            width: 100%; margin-top: 16px;
            padding: 10px;
            background: #fee2e2; color: #991b1b;
            border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            transition: background 0.12s;
        }
        .settings-logout-btn:hover { background: #fecaca; }
        .settings-login-btn {
            width: 100%; margin-top: 16px;
            padding: 10px;
            background: #2563eb; color: #fff;
            border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            transition: background 0.12s;
        }
        .settings-login-btn:hover { background: #1d4ed8; }

        /* ── Login bottom sheet ── */
        .login-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 600;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s;
        }
        .login-backdrop.open { opacity: 1; pointer-events: auto; }

        .login-sheet {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            background: #fff;
            border-radius: 20px 20px 0 0;
            z-index: 601;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            padding: 0 24px calc(32px + env(safe-area-inset-bottom));
            max-width: 430px;
        }
        .login-sheet.open { transform: translateY(0); }
        .login-drag { width: 36px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 12px auto 20px; }
        .login-title { font-size: 18px; font-weight: 700; color: #1f2937; margin-bottom: 4px; }
        .login-sub { font-size: 13px; color: #64748b; margin-bottom: 20px; }
        .login-field { margin-bottom: 12px; }
        .login-field label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
        .login-field input {
            width: 100%; padding: 10px 14px;
            border: 1.5px solid #e5e7eb; border-radius: 8px;
            font-size: 14px; color: #1f2937; outline: none;
            transition: border-color 0.15s;
        }
        .login-field input:focus { border-color: #2563eb; }
        .login-submit {
            width: 100%; padding: 12px;
            background: #2563eb; color: #fff;
            border: none; border-radius: 8px;
            font-size: 14px; font-weight: 700;
            cursor: pointer; margin-top: 4px;
            transition: background 0.12s;
        }
        .login-submit:hover { background: #1d4ed8; }
        .login-submit:disabled { background: #93c5fd; cursor: not-allowed; }
        .login-error { font-size: 12px; color: #ef4444; margin-top: 8px; min-height: 18px; }

        /* ── Toast ── */
        #toastEl {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            left: 50%; transform: translateX(-50%);
            background: #1f2937;
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px; font-weight: 500;
            z-index: 900;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            max-width: 90vw;
            text-align: center;
            transform: translateX(-50%) translateY(-8px);
            white-space: nowrap;
        }
        #toastEl.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toastEl.toast-success { background: #059669; }
        #toastEl.toast-error   { background: #dc2626; }
        #toastEl.toast-warning { background: #d97706; }

        /* ── Bottom navigation (4-tab full-width bar) ── */
        .bottom-nav {
            display: flex;
            flex-shrink: 0;
            height: calc(56px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: rgba(12, 12, 12, 0.97);
            border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 50;
        }
        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: none;
            background: none;
            cursor: pointer;
            color: rgba(255,255,255,0.38);
            transition: color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn.active { color: #fff; }
        .nav-btn svg { width: 20px; height: 20px; }
        .nav-btn span { font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
    </style>
</head>
<body>

<div id="appColumn">

    <!-- ═══ Module 0: 排班 (Schedule carousel) ═══ -->
    <div id="moduleSchedule" class="module-section active">
        <div class="view-viewport" id="viewViewport">
            <div class="view-track" id="viewTrack">

                <!-- ─ Month view ─ -->
                <section class="view-section" id="viewMonth">
                    <div class="month-content">
                        <div class="cal-month-big">
                            <span class="cal-month-name" id="calMonthName"></span>
                            <span class="cal-year-small" id="calYearSmall"></span>
                        </div>
                        <div class="cal-month-nav">
                            <button onclick="shiftMonth(-1)" aria-label="上個月">
                                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
                                </svg>
                            </button>
                            <button class="cal-today-btn" onclick="goToday()">本日</button>
                            <button onclick="shiftMonth(1)" aria-label="下個月">
                                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
                                </svg>
                            </button>
                        </div>
                        <div class="cal-grid" id="calGrid">
                            <div class="cal-hdr">日</div>
                            <div class="cal-hdr">一</div>
                            <div class="cal-hdr">二</div>
                            <div class="cal-hdr">三</div>
                            <div class="cal-hdr">四</div>
                            <div class="cal-hdr">五</div>
                            <div class="cal-hdr">六</div>
                        </div>
                    </div>
                </section>

                <!-- ─ Week view ─ -->
                <section class="view-section" id="viewWeek">
                    <div class="week-nav-bar top-bar" onclick="shiftWeek(-7)">
                        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="width:12px; height:12px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/>
                        </svg>
                        <span>上一週</span>
                    </div>
                    <div class="week-strips" id="weekStrips"></div>
                    <div class="week-nav-bar bottom-bar" onclick="shiftWeek(7)">
                        <span>下一週</span>
                        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="width:12px; height:12px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
                        </svg>
                    </div>
                </section>

            </div>

            <!-- Day modal: anchored inside view-viewport -->
            <div class="day-modal-backdrop" id="dayModalBackdrop" onclick="closeDayModal()"></div>
            <div class="day-modal" id="dayModal">
                <div class="day-modal-strip-header">
                    <div class="strip-month">
                        <span class="strip-month-label" id="modalMonthLabel"></span>
                    </div>
                    <div class="strip-date">
                        <span class="strip-weekday" id="modalWeekday"></span>
                        <span class="strip-num" id="modalDayNum"></span>
                        <div class="strip-today-dot" id="modalTodayDot" style="display:none"></div>
                    </div>
                    <div class="strip-body">
                        <span class="day-modal-label" id="dayLabel"></span>
                        <span class="day-modal-date-sub" id="dayDateSub"></span>
                    </div>
                    <button class="day-modal-close" onclick="closeDayModal()">✕</button>
                </div>
                <div class="day-modal-scroll">
                    <div id="dayEvents"><div class="day-empty">尚無班表行程</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ Module 1: 展區 (Popup planning) ═══ -->
    <div id="modulePopup" class="module-section"></div>

    <!-- ═══ Module 2: 員工 (Employees) ═══ -->
    <div id="moduleEmployees" class="module-section"></div>

    <!-- ── Bottom navigation (4 tabs) ── -->

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<!-- Modules -->
<script src="module-popup.js"></script>
<script src="module-employees.js"></script>

<script>
    // ── Constants ──────────────────────────────────────────────────────────
    const WEEKDAYS      = ['日','一','二','三','四','五','六'];
    const DAY_MONTHS_EN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const MONTH_NAMES   = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

    // ── State ──────────────────────────────────────────────────────────────
    const state = {
        view:     0,
        viewDate: new Date(),
        calYear:  new Date().getFullYear(),
        calMonth: new Date().getMonth(),
    };

    // ── Firebase ───────────────────────────────────────────────────────────
    let _db   = null;
    let _auth = null;
    let _currentUser = null;
    let _userProfile = null; // Firestore employees/{empId} doc

    try {
        firebase.initializeApp(FIREBASE_CONFIG);
        _db   = firebase.firestore();
        _auth = firebase.auth();

        _auth.onAuthStateChanged(async function(user) {
            _currentUser = user;
            _userProfile = null;

            if (user) {
                try {
                    const empId = user.displayName || user.uid;
                    const snap = await _db.collection('employees').doc(empId).get();
                    if (snap.exists) _userProfile = snap.data();
                } catch(e) { /* ignore, non-critical */ }
            }

            updateSettingsAuth();

            // Re-initialize active non-schedule modules when auth changes
            if (_activeModuleIdx > 0) {
                const m = MODULES[_activeModuleIdx];
                if (m.module) {
                    m.initialized = false;
                    _initModule(_activeModuleIdx);
                }
            }
        });
    } catch(e) {
        console.warn('Firebase init failed:', e.message);
    }

    // ── Module registry ────────────────────────────────────────────────────
    const MODULES = [
        { id: 'moduleSchedule', navId: 'navSchedule', module: null, initialized: true  },
        { id: 'modulePopup',    navId: 'navPopup',    module: null, initialized: false },
        { id: 'moduleEmployees',navId: 'navEmployees',module: null, initialized: false },
    ];

    // Assign modules after scripts are loaded
    if (typeof PopupModule !== 'undefined')    MODULES[1].module = PopupModule;
    if (typeof EmployeesModule !== 'undefined') MODULES[2].module = EmployeesModule;

    let _activeModuleIdx = 0;

    function _moduleCtx(idx) {
        return {
            db:             _db,
            getCurrentUser: function() { return _currentUser; },
            isAdmin:        function() { return _userProfile && _userProfile.role === 'admin'; },
            getDate:        function() { return localDateStr(state.viewDate); },
            setDate:        function(d) { state.viewDate = new Date(d + 'T00:00:00'); },
            toast:          showToast,
            container:      document.getElementById(MODULES[idx].id),
        };
    }

    function _initModule(idx) {
        const m = MODULES[idx];
        if (!m.module) return;
        m.module.init(_moduleCtx(idx));
        m.initialized = true;
    }

    function switchModule(idx) {
        if (idx === _activeModuleIdx) return;

        // Hide current
        const curr = MODULES[_activeModuleIdx];
        document.getElementById(curr.id).classList.remove('active');
        document.getElementById(curr.navId).classList.remove('active');
        if (curr.module && curr.module.onHide) curr.module.onHide();
        if (_activeModuleIdx === 0) closeDayModal();

        _activeModuleIdx = idx;

        // Show next
        const next = MODULES[idx];
        document.getElementById(next.id).classList.add('active');
        document.getElementById(next.navId).classList.add('active');

        if (next.module) {
            if (!next.initialized) {
                _initModule(idx);
            } else {
                if (next.module.onShow) next.module.onShow();
            }
        }
    }

    // ── Toast ──────────────────────────────────────────────────────────────
    let _toastTimer = null;

    function showToast(msg, type) {
        const el = document.getElementById('toastEl');
        if (!el) return;
        el.textContent = msg;
        el.className = 'show' + (type === 'success' ? ' toast-success' : type === 'error' ? ' toast-error' : type === 'warning' ? ' toast-warning' : '');
        if (_toastTimer) clearTimeout(_toastTimer);
        _toastTimer = setTimeout(function() {
            el.className = '';
        }, 3000);
    }

    // ── Auth UI ────────────────────────────────────────────────────────────
    function updateSettingsAuth() {
        const user = _currentUser;
        const empId = user ? (user.displayName || user.uid) : null;

        document.getElementById('settingsAuthStatus').textContent = user ? '已登入' : '未登入';
        document.getElementById('settingsUserRow').style.display  = user ? '' : 'none';
        document.getElementById('settingsEmailRow').style.display = user ? '' : 'none';
        document.getElementById('settingsLoginBtn').style.display = user ? 'none' : '';
        document.getElementById('settingsLogoutBtn').style.display = user ? '' : 'none';

        if (user) {
            document.getElementById('settingsUserId').textContent = empId || '—';
            document.getElementById('settingsEmail').textContent  = user.email || '—';
        }
    }

    function openLogin() {
        closeSettings();
        document.getElementById('loginError').textContent = '';
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginBackdrop').classList.add('open');
        document.getElementById('loginSheet').classList.add('open');
        document.getElementById('loginSubmit').disabled = false;
        setTimeout(function() { document.getElementById('loginEmail').focus(); }, 300);
    }

    function closeLogin() {
        document.getElementById('loginBackdrop').classList.remove('open');
        document.getElementById('loginSheet').classList.remove('open');
    }

    async function doLogin() {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errEl    = document.getElementById('loginError');
        const btn      = document.getElementById('loginSubmit');

        if (!email || !password) { errEl.textContent = '請輸入電子郵件與密碼'; return; }
        if (!_auth) { errEl.textContent = 'Firebase 未初始化'; return; }

        btn.disabled = true;
        btn.textContent = '登入中…';
        errEl.textContent = '';

        try {
            await _auth.signInWithEmailAndPassword(email, password);
            closeLogin();
            showToast('登入成功', 'success');
        } catch(e) {
            let msg = '登入失敗，請確認帳號密碼';
            if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password') {
                msg = '帳號或密碼不正確';
            } else if (e.code === 'auth/too-many-requests') {
                msg = '嘗試次數過多，請稍後再試';
            } else if (e.code === 'auth/network-request-failed') {
                msg = '網路連線失敗';
            }
            errEl.textContent = msg;
            btn.disabled = false;
            btn.textContent = '登入';
        }
    }

    async function doLogout() {
        if (!_auth) return;
        try {
            await _auth.signOut();
            showToast('已登出', 'success');
            closeSettings();
        } catch(e) {
            showToast('登出失敗：' + e.message, 'error');
        }
    }

    // ── Settings overlay ────────────────────────────────────────────────────
    function openSettings() {
        document.getElementById('overlayBackdrop').classList.add('open');
        document.getElementById('settingsPanel').classList.add('open');
    }

    function closeSettings() {
        document.getElementById('overlayBackdrop').classList.remove('open');
        document.getElementById('settingsPanel').classList.remove('open');
    }

    // Enter on password field triggers login
    document.getElementById('loginPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
    });

    // ── Month navigation (new arrows) ─────────────────────────────────────
    function shiftMonth(delta) {
        state.calMonth += delta;
        if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
        if (state.calMonth < 0)  { state.calMonth = 11; state.calYear--; }
        renderMonth();
    }

    function goToday() {
        const now = new Date();
        state.calYear  = now.getFullYear();
        state.calMonth = now.getMonth();
        state.viewDate = now;
        renderMonth();
    }

    // ── View carousel ─────────────────────────────────────────────────────
    function positionTrack(animate) {
        const track = document.getElementById('viewTrack');
        const tx = -state.view * 100;
        if (!animate) track.style.transition = 'none';
        track.style.transform = 'translateX(' + tx + '%)';
        if (!animate) {
            requestAnimationFrame(function() { track.style.transition = ''; });
        }
    }

    function switchView(idx) {
        state.view = Math.max(0, Math.min(1, idx));
        positionTrack(true);
        updateNavCarousel();
    }

    function updateNavCarousel() {
        // No inner nav buttons for schedule module carousel now — navigated by swipe/click
    }

    // ── Month view ─────────────────────────────────────────────────────────
    function renderMonth() {
        document.getElementById('calMonthName').textContent = MONTH_NAMES[state.calMonth];
        document.getElementById('calYearSmall').textContent = state.calYear;

        const grid = document.getElementById('calGrid');
        const headers = Array.from(grid.querySelectorAll('.cal-hdr'));
        grid.innerHTML = '';
        headers.forEach(function(h) { grid.appendChild(h); });

        const firstDow  = new Date(state.calYear, state.calMonth, 1).getDay();
        const daysInMon = new Date(state.calYear, state.calMonth + 1, 0).getDate();
        const todayStr  = localDateStr(new Date());
        const selStr    = localDateStr(state.viewDate);

        for (var i = 0; i < firstDow; i++) {
            const el = document.createElement('div');
            el.className = 'cal-day empty';
            grid.appendChild(el);
        }

        for (var d = 1; d <= daysInMon; d++) {
            const dateStr = state.calYear + '-' + pad(state.calMonth + 1) + '-' + pad(d);
            const el = document.createElement('div');
            el.className = 'cal-day';
            if (dateStr === todayStr) el.classList.add('today');
            if (dateStr === selStr)   el.classList.add('selected');
            el.innerHTML = '<span class="day-num">' + d + '</span>';
            el.addEventListener('click', (function(ds) {
                return function() {
                    state.viewDate = new Date(ds + 'T00:00:00');
                    switchView(1);
                };
            })(dateStr));
            grid.appendChild(el);
        }
    }

    // ── Week view ──────────────────────────────────────────────────────────
    function renderWeek() {
        const sunday = weekSunday(state.viewDate);
        const todayStr = localDateStr(new Date());
        const container = document.getElementById('weekStrips');
        container.innerHTML = '';

        for (var i = 0; i < 7; i++) {
            const d = new Date(sunday);
            d.setDate(sunday.getDate() + i);
            const dStr = localDateStr(d);

            const showMonth = (i === 0) || (d.getMonth() !== new Date(sunday.getTime() + (i-1)*86400000).getMonth());
            const monthStr = showMonth ? (d.getMonth() + 1) + '月' : '';
            const isToday  = dStr === todayStr;

            const strip = document.createElement('div');
            strip.className = 'day-strip' + (isToday ? ' today' : '');
            strip.innerHTML =
                '<div class="strip-month">' +
                    (showMonth ? '<span class="strip-month-label">' + monthStr + '</span>' : '') +
                '</div>' +
                '<div class="strip-date">' +
                    '<span class="strip-weekday">' + WEEKDAYS[d.getDay()] + '</span>' +
                    '<span class="strip-num">' + d.getDate() + '</span>' +
                    (isToday ? '<div class="strip-today-dot"></div>' : '') +
                '</div>' +
                '<div class="strip-body">' +
                    '<span class="strip-empty">尚無事件</span>' +
                    '<div class="strip-weather"><span>—</span></div>' +
                '</div>';

            strip.addEventListener('click', (function(dd, stripEl) {
                return function() {
                    state.viewDate = new Date(dd);
                    openDayModal(stripEl);
                };
            })(d, strip));

            container.appendChild(strip);
        }
    }

    // ── Day modal ──────────────────────────────────────────────────────────
    let activeStrip = null;

    function openDayModal(stripEl) {
        const d        = state.viewDate;
        const todayStr = localDateStr(new Date());
        const dStr     = localDateStr(d);
        const isToday  = dStr === todayStr;

        let label = '週' + WEEKDAYS[d.getDay()];
        if (isToday) label = '今日';

        document.getElementById('modalMonthLabel').textContent = (d.getMonth() + 1) + '月';
        document.getElementById('modalWeekday').textContent    = WEEKDAYS[d.getDay()];
        document.getElementById('modalDayNum').textContent     = d.getDate();
        document.getElementById('modalTodayDot').style.display = isToday ? '' : 'none';
        document.getElementById('dayLabel').textContent        = label;
        document.getElementById('dayDateSub').textContent      =
            d.getDate() + ' ' + DAY_MONTHS_EN[d.getMonth()] + ' ' + d.getFullYear();

        document.getElementById('dayEvents').innerHTML = '<div class="day-empty">尚無班表行程</div>';

        const viewport  = document.getElementById('viewViewport');
        const vpRect    = viewport.getBoundingClientRect();
        const sRect     = stripEl.getBoundingClientRect();
        const originPct = ((sRect.top - vpRect.top) / vpRect.height * 100).toFixed(2) + '%';

        const modal = document.getElementById('dayModal');
        modal.style.transition = 'none';
        modal.style.top = originPct;
        modal.offsetHeight;

        requestAnimationFrame(function() {
            modal.style.transition = 'top 0.36s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            modal.style.top = '15%';
            document.getElementById('dayModalBackdrop').classList.add('open');
        });

        if (activeStrip) activeStrip.classList.remove('strip-active');
        activeStrip = stripEl;
        stripEl.classList.add('strip-active');
    }

    function closeDayModal() {
        const modal    = document.getElementById('dayModal');
        const backdrop = document.getElementById('dayModalBackdrop');
        if (!backdrop.classList.contains('open')) return;
        backdrop.classList.remove('open');

        if (activeStrip) {
            const viewport  = document.getElementById('viewViewport');
            const vpRect    = viewport.getBoundingClientRect();
            const sRect     = activeStrip.getBoundingClientRect();
            const originPct = ((sRect.top - vpRect.top) / vpRect.height * 100).toFixed(2) + '%';

            const strip = activeStrip;
            activeStrip = null;

            requestAnimationFrame(function() {
                modal.style.transition = 'top 0.28s cubic-bezier(0.55, 0, 1, 0.45)';
                modal.style.top = originPct;
            });
            setTimeout(function() {
                strip.classList.remove('strip-active');
                modal.style.transition = 'none';
                modal.style.top = '100%';
            }, 320);
        } else {
            requestAnimationFrame(function() {
                modal.style.transition = 'top 0.28s cubic-bezier(0.55, 0, 1, 0.45)';
                modal.style.top = '100%';
            });
            setTimeout(function() { modal.style.transition = 'none'; }, 320);
        }
    }

    // ── Swipe gestures (schedule module) ──────────────────────────────────
    let touchStartX = 0, touchStartY = 0;

    document.getElementById('viewTrack').addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.getElementById('viewTrack').addEventListener('touchend', function(e) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
            switchView(state.view + (dx < 0 ? 1 : -1));
        }
    }, { passive: true });

    let weekTouchStartX = 0, weekTouchStartY = 0;
    document.getElementById('viewWeek').addEventListener('touchstart', function(e) {
        weekTouchStartX = e.touches[0].clientX;
        weekTouchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.getElementById('viewWeek').addEventListener('touchend', function(e) {
        const dx = e.changedTouches[0].clientX - weekTouchStartX;
        const dy = e.changedTouches[0].clientY - weekTouchStartY;
        if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 40) {
            shiftWeek(dy < 0 ? 7 : -7);
        }
    }, { passive: true });

    function shiftWeek(days) {
        const strips = document.getElementById('weekStrips');
        const dir    = days > 0 ? -1 : 1;
        strips.style.transition = 'transform 0.22s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.22s';
        strips.style.transform  = 'translateY(' + (dir * -50) + '%)';
        strips.style.opacity    = '0';
        setTimeout(function() {
            state.viewDate = new Date(state.viewDate.getTime() + days * 86400000);
            renderWeek();
            strips.style.transition = 'none';
            strips.style.transform  = 'translateY(' + (dir * 50) + '%)';
            strips.style.opacity    = '0';
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    strips.style.transition = 'transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.22s';
                    strips.style.transform  = 'translateY(0)';
                    strips.style.opacity    = '1';
                });
            });
        }, 200);
    }

    // ── Utilities ──────────────────────────────────────────────────────────
    function weekSunday(d) {
        const s = new Date(d);
        s.setDate(d.getDate() - d.getDay());
        s.setHours(0, 0, 0, 0);
        return s;
    }

    function localDateStr(d) {
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    // ── Service Worker ─────────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function() {});
        var _swRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!_swRefreshing) { _swRefreshing = true; window.location.reload(); }
        });
    }

    // ── Boot ───────────────────────────────────────────────────────────────
    (function boot() {
        renderMonth();
        renderWeek();
        positionTrack(false);
        updateSettingsAuth();

        // Assign modules (in case scripts loaded after MODULES array was created)
        if (typeof PopupModule !== 'undefined')     MODULES[1].module = PopupModule;
        if (typeof EmployeesModule !== 'undefined') MODULES[2].module = EmployeesModule;
    })();
</script>
</body>
